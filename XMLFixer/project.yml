name: XMLFixer
options:
  bundleIdPrefix: com.xmlfixer
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  XMLFixer:
    type: application
    platform: macOS
    sources:
      - path: XMLFixer
    settings:
      base:
        INFOPLIST_FILE: XMLFixer/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xmlfixer.XMLFixer
        PRODUCT_NAME: XML Fixer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
        CODE_SIGNING_ALLOWED: false
    info:
      path: XMLFixer/App/Info.plist
      properties:
        CFBundleName: XML Fixer
        CFBundleDisplayName: XML Fixer
        CFBundleIdentifier: com.xmlfixer.XMLFixer
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: XML Fixer
        LSMinimumSystemVersion: "14.0"
        NSMainStoryboardFile: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: XML Document
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - public.xml
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
  XMLFixerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: XMLFixerTests
    dependencies:
      - target: XMLFixer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xmlfixer.XMLFixerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XML Fixer.app/Contents/MacOS/XML Fixer"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
        CODE_SIGNING_ALLOWED: false
